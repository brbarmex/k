# Grafana na sua máquina para a sessão na AWS. O Prometheus roda no cluster 1 (nó
# dr/role=monitoramento, helm/valores/prometheus.yaml) e chega aqui pelo port-forward do
# scripts/ponte.sh (localhost:19090). Porta 3001 para não colidir com o compose da POC.
#
# Depois do destroy: task obs:snapshot copia a TSDB para observabilidade/snapshot/ e
#   docker compose --profile analise up -d
# sobe um Prometheus local (localhost:9096) sobre ela; aponte o Grafana para ele com
#   PROM_URL=http://prometheus:9090 docker compose --profile analise up -d
name: dr-obs-aws

services:
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # Só local: acesso anônimo de administrador, como no compose da POC.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/datareplication.json
      GF_USERS_DEFAULT_THEME: dark
      PROM_URL: "${PROM_URL:-http://host.docker.internal:19090}"
      # CloudWatch com a sua credencial local (perfil do ~/.aws).
      AWS_PROFILE: "${AWS_PROFILE:-default}"
      AWS_SDK_LOAD_CONFIG: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../DataReplicationApp/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${HOME}/.aws:/usr/share/grafana/.aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; no Mac já existe
    ports:
      - "3001:3000"

  # Só para análise depois do destroy, sobre o snapshot trazido da AWS.
  prometheus:
    profiles: [analise]
    image: prom/prometheus:v3.15.1 # mesma versão do chart 29.37.1 na AWS
    user: root # o snapshot vem com o dono do kubectl cp
    command:
      - --config.file=/etc/prometheus/vazio.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3650d
    volumes:
      - ./vazio.yml:/etc/prometheus/vazio.yml:ro
      - ./snapshot:/prometheus
    ports:
      - "9096:9090"

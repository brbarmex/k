# Prometheus e Grafana na sua máquina para a sessão na AWS (05_observabilidade_local.md,
# seção 0). As métricas das 3 células chegam pelos port-forwards do scripts/ponte.sh
# (localhost:19091..19093). Portas diferentes das do compose da POC (9095 e 3000) para
# os dois poderem rodar juntos. Os dados ficam no volume prometheus-aws e sobrevivem ao
# destroy da AWS.
name: dr-obs-aws

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-aws:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; no Mac já existe
    ports:
      - "9096:9090"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # Só local: acesso anônimo de administrador, como no compose da POC.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/datareplication.json
      GF_USERS_DEFAULT_THEME: dark
      # CloudWatch com a sua credencial local (perfil do ~/.aws).
      AWS_PROFILE: "${AWS_PROFILE:-default}"
      AWS_SDK_LOAD_CONFIG: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../DataReplicationApp/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${HOME}/.aws:/usr/share/grafana/.aws:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-aws:

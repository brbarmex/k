apiVersion: 1

datasources:
  # Mesmo uid do compose da POC: o dashboard v2 funciona sem mudança.
  - name: Prometheus
    uid: prometheus-dr
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 1s
  # EBS e DynamoDB do lado da AWS. Cada leitura custa (US$ 0,01 por mil métricas):
  # painéis com atualização de 1 min.
  - name: CloudWatch
    uid: cloudwatch-dr
    type: cloudwatch
    editable: false
    jsonData:
      authType: default
      defaultRegion: sa-east-1

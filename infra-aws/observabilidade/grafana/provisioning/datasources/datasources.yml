apiVersion: 1

datasources:
  # Mesmo uid do compose da POC: o dashboard funciona sem mudança. PROM_URL vem do
  # compose (Prometheus do cluster 1 pelo port-forward, ou o local de análise).
  - name: Prometheus
    uid: prometheus-dr
    type: prometheus
    access: proxy
    url: ${PROM_URL}
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 1s
  # EBS e DynamoDB do lado da AWS. Cada leitura custa (US$ 0,01 por mil métricas):
  # painéis com atualização de 1 min.
  - name: CloudWatch
    uid: cloudwatch-dr
    type: cloudwatch
    editable: false
    jsonData:
      authType: default
      defaultRegion: sa-east-1

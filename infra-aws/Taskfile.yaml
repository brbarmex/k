# Taskfile da sessão na AWS (Task v3). Roteiro: README.md desta pasta e
# 04_roteiro_da_sessao.md do plano. Rode a partir de infra-aws/.
version: "3"

vars:
  REGIAO: sa-east-1
  TTL_HORAS: '{{.TTL_HORAS | default "3.5"}}'
  TF_SESSAO: terraform/sessao
  TF_CONTA: terraform/conta
  CELULAS: "1 2 3"

tasks:
  # ---------- uma vez por conta ----------
  conta:up:
    desc: Aplica a stack conta (Budgets, anomalia, autodestruição). Uma vez só; nunca destruir.
    dir: "{{.TF_CONTA}}"
    cmds:
      - terraform init -input=false
      - terraform apply

  # ---------- AWS da sessão ----------
  aws:up:
    desc: Cria VPC, 3 EKS, nós, tabelas e DNS; grava expira-em = agora + TTL_HORAS (padrão 3,5 h).
    dir: "{{.TF_SESSAO}}"
    vars:
      MEU_IP:
        sh: curl -s https://checkip.amazonaws.com
      EXPIRA:
        sh: python3 -c "import datetime as d; print((d.datetime.now(d.timezone.utc)+d.timedelta(hours={{.TTL_HORAS}})).strftime('%Y-%m-%dT%H:%M:%SZ'))"
    cmds:
      - terraform init -input=false
      - terraform apply -var meu_ip_cidr={{.MEU_IP}}/32 -var expira_em={{.EXPIRA}}
      - echo "autodestruição a partir de {{.EXPIRA}} (UTC)"

  aws:estender:
    desc: Adia a autodestruição (HORAS=2 a partir de agora). Só muda etiquetas.
    dir: "{{.TF_SESSAO}}"
    vars:
      MEU_IP:
        sh: curl -s https://checkip.amazonaws.com
      EXPIRA:
        sh: python3 -c "import datetime as d; print((d.datetime.now(d.timezone.utc)+d.timedelta(hours={{.HORAS | default "2"}})).strftime('%Y-%m-%dT%H:%M:%SZ'))"
    cmds:
      - terraform apply -var meu_ip_cidr={{.MEU_IP}}/32 -var expira_em={{.EXPIRA}}

  aws:ip:
    desc: Seu IP mudou e o kubectl parou? Reaplica a lista de IPs da API do EKS mantendo o expira-em.
    dir: "{{.TF_SESSAO}}"
    vars:
      MEU_IP:
        sh: curl -s https://checkip.amazonaws.com
      EXPIRA:
        sh: terraform output -raw expira_em
    cmds:
      - terraform apply -var meu_ip_cidr={{.MEU_IP}}/32 -var expira_em={{.EXPIRA}}

  aws:kubeconfig:
    desc: Cria os contextos cluster-1..3 no kubeconfig.
    cmds:
      - for: { var: CELULAS, split: " " }
        cmd: aws eks update-kubeconfig --region {{.REGIAO}} --name dr-poc-cell-{{.ITEM}} --alias cluster-{{.ITEM}}

  aws:down:
    desc: Destroy da stack sessao. Rode k8s:down antes, senão os volumes EBS ficam órfãos.
    dir: "{{.TF_SESSAO}}"
    vars:
      EXPIRA:
        sh: terraform output -raw expira_em 2>/dev/null || echo 2000-01-01T00:00:00Z
    cmds:
      - terraform destroy -var meu_ip_cidr=0.0.0.0/32 -var expira_em={{.EXPIRA}}

  aws:verificar:
    desc: Confere que nada da POC ficou cobrando depois do destroy.
    cmds:
      - REGIAO={{.REGIAO}} ./scripts/verificar.sh

  # ---------- Kubernetes ----------
  k8s:up:
    desc: Sobe ExternalDNS e a célula em cada cluster, e o pod do k6 no cluster 1. IMAGE=ghcr.io/...@sha256:... (linux/arm64)
    requires:
      vars: [IMAGE]
    cmds:
      - for: { var: CELULAS, split: " " }
        cmd: kubectl kustomize k8s/overlays/cell-{{.ITEM}} | sed "s#IMAGEM_DA_POC#{{.IMAGE}}#" | kubectl --context cluster-{{.ITEM}} apply -f -
      - kubectl --context cluster-1 apply -k k8s/k6

  k8s:pronto:
    desc: Espera os 3 registros no DNS privado e o /readyz das 3 células.
    cmds:
      - for: { var: CELULAS, split: " " }
        cmd: kubectl --context cluster-{{.ITEM}} -n dr wait --for=condition=Ready pod/cell-{{.ITEM}}-0 --timeout=10m
      - for: { var: CELULAS, split: " " }
        cmd: kubectl --context cluster-1 -n teste exec k6 -- wget -qO- http://cell-{{.ITEM}}-0.cell-{{.ITEM}}.dr.internal:9090/status; echo

  k8s:down:
    desc: Apaga namespaces dr, external-dns e teste e espera os volumes sumirem (antes do aws:down).
    cmds:
      - for: { var: CELULAS, split: " " }
        cmd: kubectl --context cluster-{{.ITEM}} delete namespace dr external-dns teste --ignore-not-found --wait=true
      - for: { var: CELULAS, split: " " }
        cmd: |
          until [ -z "$(kubectl --context cluster-{{.ITEM}} get pv -o name)" ]; do
            echo "cluster-{{.ITEM}}: esperando os PVs sumirem..."; sleep 5
          done

  # ---------- observabilidade local ----------
  obs:up:
    desc: Prometheus (localhost:9096) e Grafana (localhost:3001) na sua máquina.
    dir: observabilidade
    cmds:
      - docker compose up -d

  obs:ponte:
    desc: Port-forwards em laço das 3 células (métricas em 1909N, API em 1800N). Ctrl-C encerra.
    cmds:
      - ./scripts/ponte.sh

  # ---------- carga ----------
  k6:rodar:
    desc: "Roda o k6 no cluster 1. Ex.: task k6:rodar CENARIO=baseline PERFIL=constante TPS=500 DURACAO=3m ENTRADA=todas"
    vars:
      CENARIO: '{{.CENARIO | default "sem-nome"}}'
    cmds:
      - >-
        kubectl --context cluster-1 -n teste exec k6 -- k6 run
        -e CENARIO={{.CENARIO}} -e PERFIL={{.PERFIL | default "constante"}} -e TPS={{.TPS | default "500"}}
        -e DURACAO={{.DURACAO | default "3m"}} -e ENTRADA={{.ENTRADA | default "todas"}}
        -e MAX={{.MAX | default "2000"}}
        --out json=/out/{{.CENARIO}}.json --summary-export=/out/{{.CENARIO}}-resumo.json
        /scripts/carga.js

  k6:coletar:
    desc: Copia ledger e resumo de um cenário para resultados/ (CENARIO=...).
    requires:
      vars: [CENARIO]
    cmds:
      - mkdir -p resultados/{{.CENARIO}}
      - kubectl --context cluster-1 -n teste exec k6 -- gzip -kf /out/{{.CENARIO}}.json
      - kubectl --context cluster-1 -n teste cp k6:/out/{{.CENARIO}}.json.gz resultados/{{.CENARIO}}/ledger.json.gz
      - kubectl --context cluster-1 -n teste cp k6:/out/{{.CENARIO}}-resumo.json resultados/{{.CENARIO}}/resumo.json
      - for: { var: CELULAS, split: " " }
        cmd: kubectl --context cluster-{{.ITEM}} -n dr logs cell-{{.ITEM}}-0 --since=30m > resultados/{{.CENARIO}}/cell-{{.ITEM}}.log
      - for: { var: CELULAS, split: " " }
        cmd: kubectl --context cluster-{{.ITEM}} get events -A --sort-by=.lastTimestamp > resultados/{{.CENARIO}}/eventos-cluster-{{.ITEM}}.txt
      - for: { var: CELULAS, split: " " }
        cmd: kubectl --context cluster-{{.ITEM}} top pod -A > resultados/{{.CENARIO}}/top-cluster-{{.ITEM}}.txt || true

  # ---------- injeção de falha ----------
  falha:shell:
    desc: Abre um shell privilegiado no nó da célula (CLUSTER=N) para tc, iptables e fsfreeze.
    requires:
      vars: [CLUSTER]
    cmds:
      - kubectl --context cluster-{{.CLUSTER}} apply -f k8s/falhas/netshoot.yaml
      - kubectl --context cluster-{{.CLUSTER}} wait --for=condition=Ready pod/falha --timeout=2m
      - kubectl --context cluster-{{.CLUSTER}} exec -it falha -- bash
    interactive: true

  falha:fim:
    desc: Remove o pod de injeção de falha (CLUSTER=N). Desfaça tc/iptables antes.
    requires:
      vars: [CLUSTER]
    cmds:
      - kubectl --context cluster-{{.CLUSTER}} delete pod falha --ignore-not-found

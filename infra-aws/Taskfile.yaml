# Taskfile da sessão na AWS (Task v3). Roteiro: README.md desta pasta e
# 04_roteiro_da_sessao.md do plano. Rode a partir de infra-aws/.
version: "3"

vars:
  REGIAO: sa-east-1
  TTL_HORAS: '{{.TTL_HORAS | default "3.5"}}'
  TF_SESSAO: terraform/sessao
  TF_CONTA: terraform/conta
  CELULAS: "1 2 3"
  VERSAO_PROMETHEUS: 29.37.1   # chart prometheus-community/prometheus (Prometheus v3.15.1)
  VERSAO_EXTERNAL_DNS: 1.22.0  # chart kubernetes-sigs/external-dns (v0.22.0)

tasks:
  # ---------- uma vez por conta ----------
  conta:up:
    desc: Aplica a stack conta (Budgets, anomalia, autodestruição). Uma vez só; nunca destruir.
    dir: "{{.TF_CONTA}}"
    cmds:
      - terraform init -input=false
      - terraform apply

  # ---------- AWS da sessão ----------
  aws:up:
    desc: Cria VPC, 3 EKS, nós, tabelas e DNS; grava expira-em = agora + TTL_HORAS (padrão 3,5 h).
    dir: "{{.TF_SESSAO}}"
    vars:
      MEU_IP:
        sh: curl -s https://checkip.amazonaws.com
      EXPIRA:
        sh: python3 -c "import datetime as d; print((d.datetime.now(d.timezone.utc)+d.timedelta(hours={{.TTL_HORAS}})).strftime('%Y-%m-%dT%H:%M:%SZ'))"
    cmds:
      - terraform init -input=false
      - terraform apply -var meu_ip_cidr={{.MEU_IP}}/32 -var expira_em={{.EXPIRA}}
      - echo "autodestruição a partir de {{.EXPIRA}} (UTC)"

  aws:estender:
    desc: Adia a autodestruição (HORAS=2 a partir de agora). Só muda etiquetas.
    dir: "{{.TF_SESSAO}}"
    vars:
      MEU_IP:
        sh: curl -s https://checkip.amazonaws.com
      EXPIRA:
        sh: python3 -c "import datetime as d; print((d.datetime.now(d.timezone.utc)+d.timedelta(hours={{.HORAS | default "2"}})).strftime('%Y-%m-%dT%H:%M:%SZ'))"
    cmds:
      - terraform apply -var meu_ip_cidr={{.MEU_IP}}/32 -var expira_em={{.EXPIRA}}

  aws:ip:
    desc: Seu IP mudou e o kubectl parou? Reaplica a lista de IPs da API do EKS mantendo o expira-em.
    dir: "{{.TF_SESSAO}}"
    vars:
      MEU_IP:
        sh: curl -s https://checkip.amazonaws.com
      EXPIRA:
        sh: terraform output -raw expira_em
    cmds:
      - terraform apply -var meu_ip_cidr={{.MEU_IP}}/32 -var expira_em={{.EXPIRA}}

  aws:kubeconfig:
    desc: Cria os contextos cluster-1..3 no kubeconfig.
    cmds:
      - for: { var: CELULAS, split: " " }
        cmd: aws eks update-kubeconfig --region {{.REGIAO}} --name dr-poc-cell-{{.ITEM}} --alias cluster-{{.ITEM}}

  aws:down:
    desc: Destroy da stack sessao. Rode k8s:down antes, senão os volumes EBS ficam órfãos.
    dir: "{{.TF_SESSAO}}"
    vars:
      EXPIRA:
        sh: terraform output -raw expira_em 2>/dev/null || echo 2000-01-01T00:00:00Z
    cmds:
      - terraform destroy -var meu_ip_cidr=0.0.0.0/32 -var expira_em={{.EXPIRA}}

  aws:verificar:
    desc: Confere que nada da POC ficou cobrando depois do destroy.
    cmds:
      - REGIAO={{.REGIAO}} ./scripts/verificar.sh

  # ---------- Kubernetes (Helm) ----------
  helm:repos:
    desc: Registra os repositórios dos charts oficiais (Prometheus e ExternalDNS). Uma vez por máquina.
    cmds:
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
      - helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/ --force-update
      - helm repo update prometheus-community external-dns

  k8s:up:
    desc: "Por cluster: ExternalDNS, exportadores e a célula; no cluster 1 também Prometheus e k6. IMAGE=ghcr.io/...@sha256:... (linux/arm64)"
    requires:
      vars: [IMAGE]
    cmds:
      - for: { var: CELULAS, split: " " }
        cmd: >-
          helm --kube-context cluster-{{.ITEM}} upgrade --install external-dns external-dns/external-dns
          --version {{.VERSAO_EXTERNAL_DNS}} -n external-dns --create-namespace
          -f helm/valores/external-dns.yaml --set txtOwnerId=dr-poc-cell-{{.ITEM}}
      - for: { var: CELULAS, split: " " }
        cmd: >-
          helm --kube-context cluster-{{.ITEM}} upgrade --install exporters ./helm/dr-exporters
          -n monitoramento --create-namespace
      # A célula cria a StorageClass gp3-wal, que o PVC do Prometheus usa: vem antes dele.
      - for: { var: CELULAS, split: " " }
        cmd: >-
          helm --kube-context cluster-{{.ITEM}} upgrade --install cell ./helm/datareplication
          -n dr --create-namespace --set cellId={{.ITEM}} --set image={{.IMAGE}}
      - >-
        helm --kube-context cluster-1 upgrade --install prometheus prometheus-community/prometheus
        --version {{.VERSAO_PROMETHEUS}} -n monitoramento -f helm/valores/prometheus.yaml
      - helm --kube-context cluster-1 upgrade --install k6 ./helm/k6 -n teste --create-namespace

  k8s:pronto:
    desc: Espera as 3 células, o /status pelo DNS privado, os alvos do Prometheus e mostra a CPU reservada nos nós.
    cmds:
      - for: { var: CELULAS, split: " " }
        cmd: kubectl --context cluster-{{.ITEM}} -n dr wait --for=condition=Ready pod/cell-{{.ITEM}}-0 --timeout=10m
      - for: { var: CELULAS, split: " " }
        cmd: kubectl --context cluster-1 -n teste exec k6 -- wget -qO- http://cell-{{.ITEM}}-0.cell-{{.ITEM}}.dr.internal:9090/status; echo
      - kubectl --context cluster-1 -n monitoramento rollout status deploy/prometheus-server --timeout=5m
      # Esperado: 3 datareplication, 5 node-exporter e 5 cadvisor (3 células, monitoramento e k6), todos "up".
      - >-
        kubectl --context cluster-1 -n teste exec k6 --
        wget -qO- 'http://prometheus-server.monitoramento.svc/api/v1/query?query=count+by+(job)(up==1)'; echo
      - for: { var: CELULAS, split: " " }
        cmd: kubectl --context cluster-{{.ITEM}} describe node -l dr/role=cell | grep -A6 'Allocated resources'

  k8s:down:
    desc: Remove os releases e os namespaces e espera os volumes sumirem (antes do aws:down).
    cmds:
      - for: { var: CELULAS, split: " " }
        cmd: |
          for r in "cell dr" "exporters monitoramento" "prometheus monitoramento" "external-dns external-dns" "k6 teste"; do
            set -- $r
            helm --kube-context cluster-{{.ITEM}} uninstall "$1" -n "$2" --ignore-not-found --wait
          done
      # O helm não apaga os PVCs do StatefulSet: o namespace leva junto.
      - for: { var: CELULAS, split: " " }
        cmd: kubectl --context cluster-{{.ITEM}} delete namespace dr monitoramento external-dns teste --ignore-not-found --wait=true
      - for: { var: CELULAS, split: " " }
        cmd: |
          until [ -z "$(kubectl --context cluster-{{.ITEM}} get pv -o name)" ]; do
            echo "cluster-{{.ITEM}}: esperando os PVs sumirem..."; sleep 5
          done

  # ---------- observabilidade ----------
  obs:up:
    desc: Grafana na sua máquina (localhost:3001), lendo o Prometheus do cluster 1 pelo obs:ponte.
    dir: observabilidade
    cmds:
      - docker compose up -d grafana

  obs:ponte:
    desc: Port-forwards em laço (Prometheus em 19090; células em 1909N e 1800N). Ctrl-C encerra.
    cmds:
      - ./scripts/ponte.sh

  obs:snapshot:
    desc: Copia um snapshot da TSDB do Prometheus para observabilidade/snapshot/ (antes do k8s:down).
    vars:
      POD:
        sh: kubectl --context cluster-1 -n monitoramento get pod -l app.kubernetes.io/name=prometheus,app.kubernetes.io/component=server -o jsonpath='{.items[0].metadata.name}'
    cmds:
      - |
        NOME=$(kubectl --context cluster-1 -n monitoramento exec {{.POD}} -c prometheus-server -- \
          wget -qO- --post-data='' http://localhost:9090/api/v1/admin/tsdb/snapshot \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["name"])')
        rm -rf observabilidade/snapshot
        kubectl --context cluster-1 -n monitoramento cp -c prometheus-server \
          {{.POD}}:/data/snapshots/$NOME observabilidade/snapshot
        du -sh observabilidade/snapshot

  obs:analise:
    desc: Depois do destroy, Prometheus local (localhost:9096) sobre o snapshot e o Grafana apontando para ele.
    dir: observabilidade
    cmds:
      - PROM_URL=http://prometheus:9090 docker compose --profile analise up -d --force-recreate

  # ---------- carga ----------
  k6:rodar:
    desc: "Roda o k6 no cluster 1. Ex.: task k6:rodar CENARIO=baseline PERFIL=constante TPS=500 DURACAO=3m ENTRADA=todas"
    vars:
      CENARIO: '{{.CENARIO | default "sem-nome"}}'
    cmds:
      - >-
        kubectl --context cluster-1 -n teste exec k6 -- k6 run
        -e CENARIO={{.CENARIO}} -e PERFIL={{.PERFIL | default "constante"}} -e TPS={{.TPS | default "500"}}
        -e DURACAO={{.DURACAO | default "3m"}} -e ENTRADA={{.ENTRADA | default "todas"}}
        -e MAX={{.MAX | default "2000"}}
        --out json=/out/{{.CENARIO}}.json --summary-export=/out/{{.CENARIO}}-resumo.json
        /scripts/carga.js

  k6:coletar:
    desc: Copia ledger e resumo de um cenário para resultados/ (CENARIO=...).
    requires:
      vars: [CENARIO]
    cmds:
      - mkdir -p resultados/{{.CENARIO}}
      - kubectl --context cluster-1 -n teste exec k6 -- gzip -kf /out/{{.CENARIO}}.json
      - kubectl --context cluster-1 -n teste cp k6:/out/{{.CENARIO}}.json.gz resultados/{{.CENARIO}}/ledger.json.gz
      - kubectl --context cluster-1 -n teste cp k6:/out/{{.CENARIO}}-resumo.json resultados/{{.CENARIO}}/resumo.json
      - for: { var: CELULAS, split: " " }
        cmd: kubectl --context cluster-{{.ITEM}} -n dr logs cell-{{.ITEM}}-0 --since=30m > resultados/{{.CENARIO}}/cell-{{.ITEM}}.log
      - for: { var: CELULAS, split: " " }
        cmd: kubectl --context cluster-{{.ITEM}} get events -A --sort-by=.lastTimestamp > resultados/{{.CENARIO}}/eventos-cluster-{{.ITEM}}.txt
      - for: { var: CELULAS, split: " " }
        cmd: kubectl --context cluster-{{.ITEM}} top pod -A > resultados/{{.CENARIO}}/top-cluster-{{.ITEM}}.txt || true

  # ---------- injeção de falha ----------
  falha:shell:
    desc: Abre um shell privilegiado no nó da célula (CLUSTER=N) para tc, iptables e fsfreeze.
    requires:
      vars: [CLUSTER]
    cmds:
      - kubectl --context cluster-{{.CLUSTER}} apply -f falhas/netshoot.yaml
      - kubectl --context cluster-{{.CLUSTER}} wait --for=condition=Ready pod/falha --timeout=2m
      - kubectl --context cluster-{{.CLUSTER}} exec -it falha -- bash
    interactive: true

  falha:fim:
    desc: Remove o pod de injeção de falha (CLUSTER=N). Desfaça tc/iptables antes.
    requires:
      vars: [CLUSTER]
    cmds:
      - kubectl --context cluster-{{.CLUSTER}} delete pod falha --ignore-not-found

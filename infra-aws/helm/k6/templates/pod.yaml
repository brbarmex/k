# Fica ocioso; o task k6:rodar faz kubectl exec. O ledger fica em /out até o kubectl cp.
apiVersion: v1
kind: Pod
metadata:
  name: k6
  annotations:
    checksum/script: {{ .Files.Get "files/carga.js" | sha256sum }}
spec:
  nodeSelector:
    dr/role: k6
  tolerations:
    - key: dr/role
      operator: Equal
      value: k6
      effect: NoSchedule
  restartPolicy: Never
  containers:
    - name: k6
      image: {{ .Values.image }}
      command: ["sh", "-c", "sleep infinity"]
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
      volumeMounts:
        - { name: script, mountPath: /scripts }
        - { name: out, mountPath: /out }
  volumes:
    - name: script
      configMap:
        name: k6-script
    - name: out
      emptyDir: {}

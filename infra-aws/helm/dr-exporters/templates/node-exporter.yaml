# Disco do lado do SO (node_disk_*: IOPS, latência, fila, io_time), uso do volume
# (node_filesystem_*), CPU e memória do nó. O lado do EBS (fila do volume, teto de IOPS)
# só existe no CloudWatch, no Grafana local.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  labels: { app: node-exporter }
spec:
  selector:
    matchLabels: { app: node-exporter }
  template:
    metadata:
      labels: { app: node-exporter }
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: {{ .Values.nodeExporter.image }}
          args:
            - --path.rootfs=/host
            - --web.listen-address=:{{ .Values.nodeExporter.port }}
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/containerd/.+)($|/)
          ports:
            - name: metrics
              containerPort: {{ .Values.nodeExporter.port }}
          resources:
            {{- toYaml .Values.nodeExporter.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: root
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: root
          hostPath:
            path: /

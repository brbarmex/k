# Uma célula da POC num cluster. Os overlays cell-1..3 trocam o sufixo, o CELL_ID,
# o NODE_ID e o nome DNS (03_kubernetes_e_carga.md, seção 1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - storageclass.yaml
  - serviceaccount.yaml
  - service.yaml
  - statefulset.yaml

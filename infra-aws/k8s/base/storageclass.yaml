# gp3 com 3.000 IOPS e 125 MB/s (incluídos em qualquer tamanho). reclaimPolicy Delete e a
# etiqueta projeto=dr-poc para o aws:verificar e a autodestruição acharem volume órfão.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-wal
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"
  tagSpecification_1: "projeto=dr-poc"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true

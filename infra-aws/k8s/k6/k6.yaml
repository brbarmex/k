apiVersion: v1
kind: Namespace
metadata:
  name: teste
---
apiVersion: v1
kind: Pod
metadata:
  name: k6
spec:
  nodeSelector:
    dr/role: k6
  tolerations:
    - key: dr/role
      operator: Equal
      value: k6
      effect: NoSchedule
  restartPolicy: Never
  containers:
    - name: k6
      image: grafana/k6:1.2.0
      command: ["sh", "-c", "sleep infinity"]
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
      volumeMounts:
        - name: script
          mountPath: /scripts
        - name: out
          mountPath: /out
  volumes:
    - name: script
      configMap:
        name: k6-script
    - name: out
      emptyDir: {}

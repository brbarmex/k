# Tarefas da POC local do DataReplication (S.5). Requer Docker com Compose v2, Task v3 e
# AWS CLI v2. Nada de Go no host.
version: '3'

silent: true # mostra só a saída dos comandos, não o script

vars:
  CELLS: "1 2 3"            # T-06: células; API em 800N, administração em 909N
  AWS: aws                  # T-02: comando do AWS CLI
  AWS_MAX_ATTEMPTS: "1"     # T-05: sem retry automático do CLI
  CELL: "1"
  LOCALSTACK: http://localhost:4566
  ITEM_FIXO: '"nome":{"S":"Maria"},"sobrenome":{"S":"Silva"},"email":{"S":"maria.silva@exemplo.com"},"contato":{"S":"+55 11 91234-5678"}'

env:
  # T-03: credenciais fixas de teste; nenhuma credencial real.
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: sa-east-1
  AWS_DEFAULT_REGION: sa-east-1
  AWS_PAGER: ""
  AWS_MAX_ATTEMPTS: "{{.AWS_MAX_ATTEMPTS}}"

tasks:
  subir:
    desc: Sobe o compose, cria as tabelas e espera o /readyz das três células (CA-01)
    cmds:
      - docker compose up -d --build
      - task: criar-tabelas
      - |
        for N in {{.CELLS}}; do
          T=0
          until curl -fs http://localhost:909$N/readyz >/dev/null 2>&1; do
            T=$((T+1))
            if [ $T -gt 120 ]; then echo "FALHOU: cell-$N não ficou pronta em 60 s"; exit 1; fi
            sleep 0.5
          done
          echo "cell-$N pronta"
        done

  criar-tabelas:
    desc: Cria as três tabelas no LocalStack se não existirem (idempotente, CA-02)
    cmds:
      - |
        for N in {{.CELLS}}; do
          T=cadastro_cliente_cell_$N
          if {{.AWS}} dynamodb describe-table --endpoint-url {{.LOCALSTACK}} --table-name $T >/dev/null 2>&1; then
            echo "$T já existe"
          else
            {{.AWS}} dynamodb create-table --endpoint-url {{.LOCALSTACK}} --table-name $T \
              --attribute-definitions AttributeName=pk,AttributeType=S \
              --key-schema AttributeName=pk,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST >/dev/null
            echo "$T criada"
          fi
          {{.AWS}} dynamodb wait table-exists --endpoint-url {{.LOCALSTACK}} --table-name $T
        done

  escrever:
    desc: Escreve um cliente via awscli no DR da célula CELL (padrão 1)
    vars:
      PK: 'cli-{{(now).UnixNano}}' # T-01: avaliado uma vez por execução
    cmds:
      - |
        LOG=$(mktemp)
        if ! {{.AWS}} dynamodb put-item --endpoint-url http://localhost:800{{.CELL}} \
            --table-name cadastro_cliente_cell_{{.CELL}} \
            --item '{"pk":{"S":"{{.PK}}"},{{.ITEM_FIXO}}}' --debug 2> "$LOG"; then
          grep "An error occurred" "$LOG" | tail -1
          rm -f "$LOG"
          exit 1
        fi
        IDX=$(grep -io "x-dr-index': '[0-9]*" "$LOG" | grep -o '[0-9]*$' | tail -1)
        rm -f "$LOG"
        echo "pk={{.PK}} indice=$IDX"

  buscar:
    desc: Faz scan via DR em cada célula, na tabela daquela célula (sem _dr_v)
    cmds:
      - |
        for N in {{.CELLS}}; do
          echo "== cadastro_cliente_cell_$N (célula $N, via DR) =="
          {{.AWS}} dynamodb scan --consistent-read --endpoint-url http://localhost:800$N --table-name cadastro_cliente_cell_$N
        done

  ler:
    desc: Lê a PK informada via DR em cada célula (task ler PK=cli-...)
    requires:
      vars: [PK]
    cmds:
      - |
        for N in {{.CELLS}}; do
          echo "== célula $N =="
          {{.AWS}} dynamodb get-item --consistent-read --endpoint-url http://localhost:800$N \
            --table-name cadastro_cliente_cell_$N --key '{"pk":{"S":"{{.PK}}"}}'
        done

  inspecionar:
    desc: Lê as três tabelas direto no LocalStack, com _dr_v
    cmds:
      - |
        for N in {{.CELLS}}; do
          echo "== cadastro_cliente_cell_$N (direto no LocalStack) =="
          {{.AWS}} dynamodb scan --endpoint-url {{.LOCALSTACK}} --table-name cadastro_cliente_cell_$N
        done

  status:
    desc: Imprime o /status das três células
    cmds:
      - |
        for N in {{.CELLS}}; do
          echo "== cell-$N =="
          curl -s http://localhost:909$N/status || echo "(fora do ar)"
          echo
        done

  wal:
    desc: Lista os arquivos dos dois volumes da célula CELL (CA-11)
    cmds:
      - docker compose exec cell-{{.CELL}} ls -la /var/lib/dr/raft/wal /var/lib/dr/replog

  logs:
    desc: Segue os logs do compose
    cmds:
      - docker compose logs -f

  parar:
    desc: Para o compose e mantém os volumes
    cmds:
      - docker compose down

  limpar:
    desc: Para o compose e apaga os volumes
    cmds:
      - docker compose down -v

  testar:
    desc: Roda go test -race no container de teste (CA-14)
    cmds:
      - docker build --target test .

  e2e:
    desc: subir, escrever, buscar, ler e inspecionar, falhando se algo não bate (CA-03 a CA-05)
    vars:
      PK: 'cli-{{(now).UnixNano}}'
    cmds:
      - task: subir
      - |
        LOG=$(mktemp)
        {{.AWS}} dynamodb put-item --endpoint-url http://localhost:8001 --table-name cadastro_cliente_cell_1 \
          --item '{"pk":{"S":"{{.PK}}"},{{.ITEM_FIXO}}}' --debug 2> "$LOG" || { echo "FALHOU: escrita na célula 1"; grep "An error occurred" "$LOG" | tail -1; exit 1; }
        IDX=$(grep -io "x-dr-index': '[0-9]*" "$LOG" | grep -o '[0-9]*$' | tail -1)
        rm -f "$LOG"
        [ -n "$IDX" ] || { echo "FALHOU: a resposta não trouxe x-dr-index"; exit 1; }
        echo "escrito pk={{.PK}} indice=$IDX"

        for N in {{.CELLS}}; do
          GOT=$({{.AWS}} dynamodb scan --consistent-read --endpoint-url http://localhost:800$N --table-name cadastro_cliente_cell_$N \
            --query "Items[?pk.S=='{{.PK}}'] | [0].[nome.S,sobrenome.S,email.S,contato.S]" --output text)
          [ "$GOT" = "Maria	Silva	maria.silva@exemplo.com	+55 11 91234-5678" ] || { echo "FALHOU: buscar na célula $N devolveu '$GOT'"; exit 1; }
          echo "buscar célula $N: ok"

          V=$({{.AWS}} dynamodb get-item --consistent-read --endpoint-url http://localhost:800$N --table-name cadastro_cliente_cell_$N \
            --key '{"pk":{"S":"{{.PK}}"}}' --query "[Item.nome.S, Item._dr_v.N]" --output text)
          [ "$V" = "Maria	None" ] || { echo "FALHOU: ler na célula $N devolveu '$V' (sem _dr_v esperado)"; exit 1; }
          echo "ler célula $N: ok"
        done

        for N in {{.CELLS}}; do
          T=0
          while :; do
            DV=$({{.AWS}} dynamodb get-item --endpoint-url {{.LOCALSTACK}} --table-name cadastro_cliente_cell_$N \
              --key '{"pk":{"S":"{{.PK}}"}}' --query "Item._dr_v.N" --output text)
            [ "$DV" = "$IDX" ] && break
            T=$((T+1))
            [ $T -gt 8 ] && { echo "FALHOU: cadastro_cliente_cell_$N com _dr_v '$DV', esperado $IDX"; exit 1; }
            sleep 0.25
          done
          echo "inspecionar cadastro_cliente_cell_$N: _dr_v=$DV ok"
        done
        echo "e2e: OK"

# POC local do DataReplication (S.4): um LocalStack (só DynamoDB) por célula, três células AWS e a
# observabilidade (O-18): Prometheus coletando as células e Grafana com o dashboard importado.

# Variáveis iguais nas três células: a ConfState de partida tem de ser a mesma (RT-03).
x-dr-env: &dr-env
  PEERS: "1=cell-1:7000,2=cell-2:7000,3=cell-3:7000"
  TABLES: "cadastro_cliente_cell_{cell}"
  AWS_REGION: "sa-east-1"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  TABLE_WAIT: "120s"
  GATE_PUBLISH_INTERVAL: "100ms"
  APPLY_WORKERS: "16"
  # ADR-060: timeout de eleição de 3 s (30 ticks de 100 ms) no notebook: o fsync tem picos
  # de 1 a 2 s com tudo no mesmo SSD. APPLY_LAG_MAX fica no padrão (APPLY_WORKERS x 256).
  ELECTION_TICKS: "30"
  # ADR-060: vazio = padrão APPLY_WORKERS x 256. Um valor baixo (task start APPLY_LAG_MAX=50)
  # exercita a admissão por atraso do apply com pouca carga.
  APPLY_LAG_MAX: "${APPLY_LAG_MAX:-}"
  RAFT_DIR: "/var/lib/dr/raft/wal"
  # Compactação do log do Raft (S.6 da trecho, O-37). CLUSTER_ID é a identidade do grupo
  # gravada no WAL e no marcador (RT-20). GOMEMLIMIT fica abaixo do mem_limit (AP-15).
  # As demais vêm do host: vazio = padrão (task start SNAPSHOT_EVERY_ENTRIES=200 ...).
  CLUSTER_ID: "poc-local"
  GOMEMLIMIT: "${GOMEMLIMIT:-800MiB}"
  SNAPSHOT_EVERY_ENTRIES: "${SNAPSHOT_EVERY_ENTRIES:-}"
  SNAPSHOT_EVERY_BYTES: "${SNAPSHOT_EVERY_BYTES:-}"
  RAFT_CATCHUP_ENTRIES: "${RAFT_CATCHUP_ENTRIES:-}"
  RAFT_RAM_MAX: "${RAFT_RAM_MAX:-}"
  RETAIN_MAX_BYTES: "${RETAIN_MAX_BYTES:-}"
  RETAIN_DISK_HARD: "${RETAIN_DISK_HARD:-}"
  RETAIN_DISK_HARD_BYTES: "${RETAIN_DISK_HARD_BYTES:-}"
  WAL_SEGMENT_BYTES: "${WAL_SEGMENT_BYTES:-}"
  REBUILD_RETRY: "${REBUILD_RETRY:-}"
  REBUILD_PIN_TTL: "${REBUILD_PIN_TTL:-}"
  PEER_QUEUE_BYTES: "${PEER_QUEUE_BYTES:-}"

x-cell: &cell
  image: datareplication-poc:local
  pull_policy: never # a imagem é construída pela cell-1 (C-02)
  restart: on-failure
  # AP-15: teto de memória por célula; o GOMEMLIMIT acima fica em ~80% dele.
  mem_limit: "${CELL_MEM_LIMIT:-1g}"

# Um LocalStack por célula, como em produção (um DynamoDB por célula, ADR-022 e ADR-054):
# cada célula tem o seu escritor do DynamoDB Local, e pausar um deles simula o banco lento
# de uma só célula (task test-slow-db, C35).
x-localstack: &localstack
  image: localstack/localstack:4.14.0 # versão fixa (SG-14)
  environment:
    SERVICES: dynamodb
    # O DynamoDB Local roda em Java; 512m por instância (padrão do LocalStack: 256m).
    DYNAMODB_HEAP_SIZE: "${DYNAMODB_HEAP_SIZE:-512m}"
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:4566/_localstack/health"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  localstack-1:
    <<: *localstack
    ports:
      - "4566:4566"

  localstack-2:
    <<: *localstack
    ports:
      - "4567:4566"

  localstack-3:
    <<: *localstack
    ports:
      - "4568:4566"

  cell-1:
    <<: *cell
    build: .
    environment:
      <<: *dr-env
      CELL_ID: "1"
      NODE_ID: "1"
      DYNAMODB_ENDPOINT: "http://localstack-1:4566"
    depends_on:
      localstack-1: { condition: service_healthy }
    ports:
      - "8001:8000"
      - "9091:9090"
    volumes:
      - cell-1-raft:/var/lib/dr/raft

  cell-2:
    <<: *cell
    environment:
      <<: *dr-env
      CELL_ID: "2"
      NODE_ID: "2"
      DYNAMODB_ENDPOINT: "http://localstack-2:4566"
    depends_on:
      localstack-2: { condition: service_healthy }
    ports:
      - "8002:8000"
      - "9092:9090"
    volumes:
      - cell-2-raft:/var/lib/dr/raft

  cell-3:
    <<: *cell
    environment:
      <<: *dr-env
      CELL_ID: "3"
      NODE_ID: "3"
      DYNAMODB_ENDPOINT: "http://localstack-3:4566"
    depends_on:
      localstack-3: { condition: service_healthy }
    ports:
      - "8003:8000"
      - "9093:9090"
    volumes:
      - cell-3-raft:/var/lib/dr/raft

  prometheus:
    image: prom/prometheus:v3.5.0 # versão fixa
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9095:9090"
    depends_on:
      cell-1: { condition: service_started }
      cell-2: { condition: service_started }
      cell-3: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  grafana:
    image: grafana/grafana:12.1.0 # versão fixa
    environment:
      # SÓ DA POC: acesso anônimo de administrador, sem formulário de login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/datareplication-v2.json
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  cell-1-raft: { driver: local }
  cell-2-raft: { driver: local }
  cell-3-raft: { driver: local }
